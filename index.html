<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1">
<title>RENDI</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0F131A">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="RENDI">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">
<style>
:root{--ink:#0F131A;--surface:#171C26;--surface2:#1E2531;--line:#2A3341;--text:#EAEDF2;--muted:#8B94A6;--brass:#C9A24B;--up:#4FB286;--down:#DC7A6B;}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html{-webkit-text-size-adjust:100%;}
body{margin:0;min-height:100vh;background:var(--ink);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;overscroll-behavior-y:none;}
.num{font-family:ui-monospace,"SF Mono","Roboto Mono",Menlo,monospace;font-variant-numeric:tabular-nums;}
.wrap{max-width:480px;margin:0 auto;min-height:100vh;display:flex;flex-direction:column;position:relative;}
.head{padding:calc(18px + env(safe-area-inset-top)) 20px 12px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:flex-start;}
.h-title{font-size:19px;font-weight:650;margin-top:3px;}
.hbtns{display:flex;gap:8px;}
.gear{background:var(--surface2);border:1px solid var(--line);color:var(--muted);border-radius:10px;width:38px;height:38px;display:flex;align-items:center;justify-content:center;cursor:pointer;padding:0;}
.content{flex:1;padding:16px 16px 120px;}
.summary{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:18px;position:relative;overflow:hidden;}
.summary::before{content:"";position:absolute;top:0;left:0;right:0;height:2px;background:linear-gradient(90deg,var(--brass),transparent);}
.sum-label{font-size:12px;color:var(--muted);}
.sum-value{font-size:29px;font-weight:600;margin:2px 0 8px;}
.sum-chip{display:inline-flex;align-items:center;gap:5px;font-size:14px;font-weight:600;}
.ledger{border-top:1px solid var(--line);margin-top:14px;padding-top:2px;}
.lrow{display:flex;justify-content:space-between;align-items:baseline;padding:7px 0;font-size:13px;gap:12px;}
.lrow .lk{color:var(--muted);}
.lrow .lv{font-weight:600;text-align:right;}
.lrow.head-row{border-top:1px solid var(--line);margin-top:4px;padding-top:11px;}
.starbtn{display:inline-flex;align-items:center;gap:6px;background:var(--surface2);border:1px solid var(--line);border-radius:9px;padding:5px 9px;cursor:pointer;color:var(--muted);font-size:12px;}
.sec-label{font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted);font-weight:600;margin:24px 4px 10px;display:flex;align-items:center;gap:7px;}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px 15px;margin-bottom:10px;cursor:pointer;}
.card:active{border-color:var(--brass);}
.card-top{display:flex;justify-content:space-between;align-items:baseline;gap:10px;}
.name{font-weight:600;font-size:15px;}
.badge{display:inline-block;font-size:10px;font-weight:600;padding:2px 7px;border-radius:6px;margin-left:7px;vertical-align:middle;}
.ccy{font-size:10px;color:var(--brass);font-weight:600;margin-left:6px;}
.card-val{font-size:15px;font-weight:600;text-align:right;}
.acq{background:var(--surface2);border:1px solid var(--line);border-radius:11px;padding:10px 12px;margin-bottom:7px;cursor:pointer;}
.acq-top{display:flex;justify-content:space-between;gap:10px;font-size:13.5px;font-weight:600;}
.acq-sub{display:flex;justify-content:space-between;gap:10px;font-size:11.5px;color:var(--muted);margin-top:4px;}
.card-prezzo{font-size:10.5px;color:var(--muted);margin-top:3px;}
.card-peso{font-size:10.5px;color:var(--muted);text-align:right;margin-top:2px;}
.card-sub{display:flex;justify-content:space-between;align-items:center;margin-top:8px;font-size:12.5px;color:var(--muted);gap:8px;}
.chip{font-weight:600;}
.empty{text-align:center;color:var(--muted);padding:40px 24px;font-size:14px;line-height:1.5;}
.empty svg{opacity:.5;margin-bottom:12px;}
.chartcard{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px 12px 12px;margin-bottom:12px;}
.chart-title{font-size:13px;font-weight:600;margin:0 4px 10px;}
.chart-head{display:flex;align-items:center;justify-content:space-between;gap:8px;cursor:pointer;}
.chart-head .chart-title{margin-bottom:10px;flex:1;}
.chev{color:var(--muted);display:flex;margin-bottom:10px;transition:transform .15s;transform:rotate(-90deg);}
.chev.giu{transform:rotate(0deg);}
.sec-toggle{display:flex;align-items:center;gap:7px;cursor:pointer;flex:1;}
.sec-count{font-size:11px;color:var(--muted);font-weight:500;text-transform:none;letter-spacing:0;}
.legend{display:flex;flex-wrap:wrap;gap:8px 14px;margin:8px 6px 2px;}
.leg{display:flex;align-items:center;gap:6px;font-size:11.5px;color:var(--muted);}
.dot{width:9px;height:9px;border-radius:2px;flex-shrink:0;}
.tabbar{position:fixed;bottom:0;left:0;right:0;max-width:480px;margin:0 auto;background:var(--surface);border-top:1px solid var(--line);display:flex;padding:6px 4px calc(10px + env(safe-area-inset-bottom));z-index:30;}
.tab{flex:1;background:none;border:none;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:3px;padding:8px 0;font-size:10.5px;font-weight:500;cursor:pointer;font-family:inherit;}
.tab.on{color:var(--brass);}
.fab{position:fixed;bottom:calc(84px + env(safe-area-inset-bottom));right:calc(50% - 240px + 18px);width:54px;height:54px;border-radius:50%;background:var(--brass);color:#1A140A;border:none;display:flex;align-items:center;justify-content:center;box-shadow:0 6px 20px rgba(201,162,75,.35);cursor:pointer;z-index:31;}
@media(max-width:520px){.fab{right:18px;}}
.overlay{position:fixed;inset:0;background:rgba(6,9,13,.7);display:flex;align-items:flex-end;justify-content:center;z-index:50;}
.sheet{background:var(--surface);width:100%;max-width:480px;border-radius:20px 20px 0 0;border-top:1px solid var(--line);padding:8px 18px calc(26px + env(safe-area-inset-bottom));max-height:92vh;overflow-y:auto;}
.grip{width:38px;height:4px;background:var(--line);border-radius:2px;margin:8px auto 14px;}
.sheet-title{font-size:17px;font-weight:650;margin-bottom:2px;padding-right:40px;}
.sheet-sub{font-size:12.5px;color:var(--muted);margin-bottom:16px;padding-right:40px;}
.field{margin-bottom:13px;}
.label{display:block;font-size:12px;color:var(--muted);margin-bottom:6px;}
.input{width:100%;background:var(--surface2);border:1px solid var(--line);border-radius:11px;padding:12px 13px;color:var(--text);font-size:16px;outline:none;appearance:none;font-family:inherit;}
.input:focus{border-color:var(--brass);}
select.input{background-image:none;}
.row2{display:flex;gap:10px;}
.row2>.field{flex:1;min-width:0;}
.btn{width:100%;border:none;border-radius:12px;padding:14px;font-size:15px;font-weight:650;cursor:pointer;margin-top:6px;font-family:inherit;}
.btn-primary{background:var(--brass);color:#1A140A;}
.btn-ghost{background:var(--surface2);color:var(--text);border:1px solid var(--line);}
.btn-danger{background:none;color:var(--down);border:1px solid var(--line);}
.actions{display:flex;flex-direction:column;gap:9px;margin-top:4px;}
.act{display:flex;align-items:center;gap:12px;background:var(--surface2);border:1px solid var(--line);border-radius:12px;padding:14px;color:var(--text);font-size:15px;font-weight:500;cursor:pointer;text-align:left;width:100%;font-family:inherit;}
.act svg{color:var(--brass);flex-shrink:0;}
.act.danger,.act.danger svg{color:var(--down);}
.xbtn{position:absolute;top:12px;right:0;background:var(--surface2);border:1px solid var(--line);color:var(--muted);border-radius:9px;width:32px;height:32px;display:flex;align-items:center;justify-content:center;cursor:pointer;padding:0;}
.sheet-head{position:relative;}
.rate-row{display:flex;align-items:center;gap:10px;margin-bottom:10px;}
.rate-row .cc{width:52px;font-weight:600;font-size:14px;}
.hint{font-size:11.5px;color:var(--muted);margin:2px 2px 14px;line-height:1.45;}
.stars{position:relative;display:inline-block;font-size:14px;line-height:1;letter-spacing:1px;font-family:Arial,sans-serif;white-space:nowrap;}
.stars .base{color:#2A3341;}
.stars .fill{position:absolute;top:0;left:0;white-space:nowrap;overflow:hidden;color:var(--brass);}
.stars .fill.neg{color:var(--down);}
.starval.neg{color:var(--down);}
.starline{display:inline-flex;align-items:center;gap:7px;}
.starval{font-size:12.5px;color:var(--brass);font-weight:600;}
.seg{display:flex;gap:6px;margin-bottom:14px;}
.seg button{flex:1;background:var(--surface2);border:1px solid var(--line);color:var(--muted);border-radius:10px;padding:9px 6px;font-size:12.5px;font-weight:600;cursor:pointer;font-family:inherit;}
.seg button.on{background:var(--brass);color:#1A140A;border-color:var(--brass);}
.chips{display:flex;flex-wrap:wrap;gap:7px;margin-bottom:14px;}
.pchip{background:var(--surface2);border:1px solid var(--line);color:var(--muted);border-radius:20px;padding:7px 13px;font-size:12.5px;font-weight:600;cursor:pointer;}
.pchip.on{background:var(--brass);color:#1A140A;border-color:var(--brass);}
.legtable{width:100%;border-collapse:collapse;font-size:12.5px;margin-top:6px;}
.legtable th,.legtable td{text-align:right;padding:6px 4px;border-bottom:1px solid var(--line);}
.legtable th:first-child,.legtable td:first-child{text-align:left;color:var(--muted);}
.pf-switch{display:inline-flex;align-items:center;gap:4px;background:none;border:none;padding:0;cursor:pointer;color:var(--brass);font-size:11px;letter-spacing:.14em;text-transform:uppercase;font-weight:600;max-width:210px;font-family:inherit;}
.pf-switch span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.pf-row{display:flex;align-items:center;gap:8px;margin-bottom:8px;}
.pf-name{flex:1;display:flex;align-items:center;gap:9px;background:var(--surface2);border:1px solid var(--line);border-radius:12px;padding:13px 14px;color:var(--text);font-size:15px;font-weight:600;cursor:pointer;text-align:left;min-width:0;font-family:inherit;}
.pf-name>span:first-of-type{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.pf-ic{background:var(--surface2);border:1px solid var(--line);color:var(--muted);border-radius:10px;width:42px;height:46px;display:flex;align-items:center;justify-content:center;cursor:pointer;flex-shrink:0;padding:0;}
.pf-count{margin-left:auto;font-size:11.5px;color:var(--muted);font-weight:500;white-space:nowrap;}
.sortbtn{margin-left:auto;display:inline-flex;align-items:center;gap:5px;background:var(--surface2);border:1px solid var(--line);color:var(--muted);border-radius:8px;padding:4px 9px;font-size:11px;font-weight:600;text-transform:none;letter-spacing:0;cursor:pointer;font-family:inherit;}
.sortbtn.on{color:var(--brass);border-color:var(--brass);}
.warn{display:flex;gap:10px;align-items:flex-start;background:rgba(220,122,107,.09);border:1px solid rgba(220,122,107,.45);border-radius:12px;padding:12px 13px;margin-bottom:14px;font-size:12.5px;line-height:1.45;}
.warn svg{color:var(--down);flex-shrink:0;margin-top:1px;}
.savefoot{text-align:center;font-size:11px;color:var(--muted);margin:22px 0 4px;}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(150px + env(safe-area-inset-bottom));background:var(--surface2);border:1px solid var(--brass);color:var(--text);padding:11px 18px;border-radius:12px;font-size:13px;font-weight:600;z-index:60;box-shadow:0 8px 24px rgba(0,0,0,.5);max-width:300px;text-align:center;}
svg{overflow:visible;}

/* ===== iPad in orizzontale: navigazione a lato, elenco e dettaglio affiancati ===== */
@media (min-width:1000px) and (orientation:landscape){
  .wrap{max-width:none;flex-direction:row;height:100vh;overflow:hidden;}
  .side{width:210px;flex-shrink:0;background:var(--surface);border-right:1px solid var(--line);
        display:flex;flex-direction:column;padding:22px 14px calc(14px + env(safe-area-inset-bottom));}
  .side-top{padding:0 6px 18px;border-bottom:1px solid var(--line);margin-bottom:14px;}
  .side-nav{display:flex;flex-direction:column;gap:4px;}
  .snav{display:flex;align-items:center;gap:11px;background:none;border:none;color:var(--muted);
        border-radius:10px;padding:11px 12px;font-size:14px;font-weight:600;cursor:pointer;
        font-family:inherit;text-align:left;width:100%;}
  .snav:hover{background:var(--surface2);color:var(--text);}
  .snav.on{background:var(--surface2);color:var(--brass);}
  .side-bot{margin-top:auto;display:flex;flex-direction:column;gap:12px;padding-top:14px;}
  .side-add{margin:0;display:flex;align-items:center;justify-content:center;gap:8px;padding:12px;}
  .side-gears{display:flex;gap:7px;justify-content:center;}
  .side-bot .savefoot{margin:0;font-size:10px;}
  .main{flex:1;display:flex;min-width:0;overflow:hidden;}
  .col-lista{flex:1;min-width:0;overflow-y:auto;padding:22px 22px 40px;}
  .main.doppia .col-lista{flex:0 0 400px;border-right:1px solid var(--line);}
  .col-det{flex:1;min-width:0;overflow-y:auto;display:flex;flex-direction:column;background:var(--ink);}
  .det-head{display:flex;justify-content:space-between;align-items:flex-start;gap:14px;
            padding:20px 24px 14px;border-bottom:1px solid var(--line);position:sticky;top:0;
            background:var(--ink);z-index:5;}
  .det-title{font-size:19px;font-weight:650;}
  .det-sub{font-size:12.5px;color:var(--muted);margin-top:3px;}
  .det-x{position:static;flex-shrink:0;}
  .det-body{padding:16px 24px 40px;}
  /* senza titolo selezionato la colonna mostra i grafici, disposti a griglia */
  .det-grafici{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:12px;align-content:start;}
  .det-grafici .chartcard{margin-bottom:0;}
  /* nelle schermate a colonna unica i grafici si affiancano */
  .main:not(.doppia) .col-lista{max-width:none;}
  .main:not(.doppia) .chartcard{display:inline-block;width:calc(50% - 6px);vertical-align:top;margin-right:8px;}
  @media (min-width:1500px){ .main:not(.doppia) .chartcard{width:calc(33.33% - 8px);} }
  /* i pannelli diventano finestre centrate invece di salire dal basso */
  .overlay{align-items:center;}
  .sheet{max-width:560px;border-radius:18px;border:1px solid var(--line);max-height:86vh;padding:8px 24px 24px;}
  .grip{display:none;}
  .sheet-head{padding-top:14px;}
  .tabbar,.fab{display:none;}
  .card:hover{border-color:var(--brass);}
  .toast{bottom:34px;}
}
</style>
</head>

<script>
(function(){
"use strict";

/* ============ costanti ============ */
var KEY="portafoglio_v4";
var TYPES=["Azione","Obbligazione","Titolo di Stato","ETF","Fondo","Certificato di deposito","Altro"];
var CURRENCIES=["EUR","USD","GBP","CHF","JPY"];
var DEFAULT_RATES={EUR:1,USD:0.92,GBP:1.17,CHF:1.04,JPY:0.0061};
var TYPE_COLORS={"Azione":"#C9A24B","Obbligazione":"#6E8FB8","Titolo di Stato":"#4FB286","ETF":"#B07BC4","Fondo":"#D98E5A","Certificato di deposito":"#5AB3B0","Altro":"#8B94A6"};

/* ============ utilità ============ */
var eurFmt=new Intl.NumberFormat("it-IT",{style:"currency",currency:"EUR"});
function fmt(n){return eurFmt.format(isFinite(n)?n:0);}
function fmtSigned(n){return (n>=0?"+":"\u2212")+eurFmt.format(Math.abs(isFinite(n)?n:0));}
function pct(n){return (isFinite(n)?(n>=0?"+":"\u2212")+Math.abs(n).toFixed(2):"\u2014")+"%";}
function num(v){var x=parseFloat(String(v==null?"":v).replace(",","."));return isFinite(x)?x:0;}
function today(){var d=new Date();return new Date(d.getTime()-d.getTimezoneOffset()*60000).toISOString().slice(0,10);}
function dLabel(s){if(!s)return"";var d=new Date(s);return isNaN(d)?"":d.toLocaleDateString("it-IT",{day:"2-digit",month:"short",year:"numeric"});}
function uid(){return Math.random().toString(36).slice(2,10);}
function upc(n){return n>=0?"var(--up)":"var(--down)";}
function esc(s){return String(s==null?"":s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");}
function n2(v){return Math.round(v*100)/100;}
/* prezzi e prezzi medi: tre cifre dopo la virgola */
function fmtPrezzo(v){return (isFinite(v)?v:0).toLocaleString("it-IT",{minimumFractionDigits:0,maximumFractionDigits:3});}
/* tutto il resto: al massimo quattro cifre */
function fmtNum(v){return (isFinite(v)?v:0).toLocaleString("it-IT",{minimumFractionDigits:0,maximumFractionDigits:4});}
function mean(a){return a.length?a.reduce(function(s,x){return s+x;},0)/a.length:0;}

/* funzione errore, serve alla parte gaussiana della scala */
function erf(x){var s=x<0?-1:1;x=Math.abs(x);var t=1/(1+0.3275911*x);
var y=1-(((((1.061405429*t-1.453152027)*t)+1.421413741)*t-0.284496736)*t+0.254829592)*t*Math.exp(-x*x);return s*y;}
function normCdf(z){return 0.5*(1+erf(z/Math.SQRT2));}

/* ============ valutazione a stelle ============
   Scala ibrida e simmetrica rispetto allo zero:
   - da 0 a 5 stelle andamento lineare, fino alla media dei soli titoli in guadagno
   - da 5 a 10 stelle andamento gaussiano, fino al valore piu' alto del portafoglio
     escludendo il 2% dei risultati migliori
   Sotto lo zero vale la stessa identica curva col segno meno, fino a -10. */
/* media dei soli titoli in guadagno, ponderata sul capitale investito:
   un titolo su cui hai messo di piu' pesa di piu' nel definire il riferimento */
function riferimento(coppie){
  var num=0, den=0;
  coppie.forEach(function(c){ if(c.v>0 && c.peso>0){ num+=c.v*c.peso; den+=c.peso; } });
  if(!(den>0)){
    var pos=coppie.filter(function(c){return c.v>0;}).map(function(c){return c.v;});
    return pos.length?mean(pos):0;
  }
  return num/den;
}
/* il massimo escludendo il 2% dei valori piu' alti (con pochi titoli coincide col massimo) */
function riferimentoAlto(coppie){
  var pos=coppie.map(function(c){return c.v;}).filter(function(v){return v>0;}).sort(function(a,b){return b-a;});
  if(!pos.length) return 0;
  var scarta=Math.floor(pos.length*0.02);
  return pos[Math.min(scarta,pos.length-1)];
}
function curvaStelle(x,mu,alto){
  if(!(mu>0)||!isFinite(x)) return 0;
  var segno=x<0?-1:1, v=Math.abs(x);
  if(v<=mu) return segno*5*(v/mu);                 /* tratto lineare */
  var top=(alto>mu*1.0001)?alto:mu*2;              /* se il vertice non e' definito, il doppio della media */
  if(v>=top) return segno*10;
  var sigma=(top-mu)/2;                            /* il vertice cade a due deviazioni standard */
  var den=normCdf((top-mu)/sigma)-0.5;
  if(!(den>0)) return segno*10;
  return segno*(5+5*(normCdf((v-mu)/sigma)-0.5)/den);   /* tratto gaussiano */
}
function arrotondaStelle(s){
  if(!isFinite(s)) return 0;
  return Math.round(Math.max(-10,Math.min(10,s))*2)/2;
}
function starsFor(x,rif,alto){ return arrotondaStelle(curvaStelle(x,rif,alto)); }

var P={
wallet:'<path d="M3 7h15a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V7z"/><path d="M3 7V6a2 2 0 0 1 2-2h11"/><circle cx="16.5" cy="13" r="1.2" fill="currentColor" stroke="none"/>',

plus:'<path d="M12 5v14M5 12h14"/>',

/* ordina dividendi o gruppi; per i gruppi 'importo' usa il totale e 'data' l'ultimo incasso */
function ordinaDiv(lista,stato,gruppi){
  var segno=stato.verso==="asc"?-1:1, out=lista.slice();
  if(stato.campo==="nome"){
    var sn=stato.verso==="asc"?1:-1;  /* asc = dalla A alla Z */
    out.sort(function(x,y){var a=nomeChiave(x.nome||x.name),b=nomeChiave(y.nome||y.name);return a<b?-sn:a>b?sn:0;});
  }else if(stato.campo==="importo"){
    out.sort(function(x,y){return ((gruppi?y.tot:valoreDiv(y))-(gruppi?x.tot:valoreDiv(x)))*segno;});
  }else{
    out.sort(function(x,y){var a=gruppi?x.ultima:(x.date||""),b=gruppi?y.ultima:(y.date||"");return a<b?segno:a>b?-segno:0;});
  }
  return out;
}
function nomeCriterio(campo,chiusi){
  var L=chiusi?CRITERI_C:CRITERI,r=null;
  L.forEach(function(c){if(c.k===campo)r=c.n;});
  return r||"Ordina";
}
/* ordina una lista di lotti secondo il criterio scelto */
function ordina(lista,chiusi,stato,D){
  if(stato.campo==="def") return lista;
  var segno=stato.verso==="asc"?-1:1;
  var val=function(p){
    var m=metrics(p,chiusi);
    switch(stato.campo){
      case "valore": return m.value;
      case "resa":   return m.resa;
      case "nom":    return m.rendNom;
      case "nomtot": return m.rendNomTot;
      case "data":   return new Date(p.sellDate||p.buyDate||0).getTime();
      case "stelle": return starsOf(m,D||dists()).media;
      case "vRend":  return starsOf(m,D||dists()).rend;
      case "vResa":  return starsOf(m,D||dists()).resa;
      case "vAnn":   return starsOf(m,D||dists()).ann;
      case "annlin": return m.annLin;
      case "peso":   return m.value;
      default: return 0;
    }
  };
  var out=lista.slice();
  if(stato.campo==="nome"){
    out.sort(function(x,y){return nomeChiave(x.name)<nomeChiave(y.name)?-segno:nomeChiave(x.name)>nomeChiave(y.name)?segno:0;});
  }else{
    out.sort(function(x,y){return (val(y)-val(x))*segno;});
  }
  return out;
}

/* ============ acquisti multipli ============
   Un titolo e' un blocco che puo' contenere piu' acquisti (lotti), ognuno con la
   propria quantita', prezzo, data e cambio. I campi riassuntivi quantity, buyPrice,
   buyDate e buyRate restano allineati come medie ponderate, cosi' il resto dell'app
   continua a leggerli, ma tutto cio' che dipende dal tempo usa i singoli lotti. */
function lottiDi(p){
  if(p.lotti&&p.lotti.length) return p.lotti;
  return [{q:p.quantity||0, prezzo:p.buyPrice||0, data:p.buyDate||today(), cambio:p.buyRate==null?1:p.buyRate}];
}
function investitoLotto(l){ return l.q*l.prezzo*(l.cambio==null?1:l.cambio); }
/* riallinea i campi riassuntivi: prezzo medio ponderato per quantita',
   cambio medio scelto in modo che quantita' x prezzo x cambio dia l'investito esatto */
function ricalcola(p){
  var L=lottiDi(p), q=0, spesaValuta=0, investito=0, prima=null;
  L.forEach(function(l){
    q+=l.q; spesaValuta+=l.q*l.prezzo; investito+=investitoLotto(l);
    if(l.data && (prima===null || l.data<prima)) prima=l.data;
  });
  p.lotti=L;
  p.quantity=q;
  p.buyPrice=q>0?spesaValuta/q:0;
  p.buyRate=(q>0&&p.buyPrice>0)?investito/(q*p.buyPrice):1;
  p.buyDate=prima||today();
  return p;
}
/* durata media di possesso, pesata sul capitale investito in ciascun acquisto */
function anniPesati(p,fine){
  var L=lottiDi(p), num=0, den=0;
  L.forEach(function(l){
    var inv=investitoLotto(l);
    var y=Math.max(1/365.25,(fine-new Date(l.data))/86400000/365.25);
    num+=inv*y; den+=inv;
  });
  if(den>0) return num/den;
  return Math.max(1/365.25,(fine-new Date(p.buyDate))/86400000/365.25);
}
/* unita' che il blocco possedeva a una certa data: contano solo gli acquisti gia' avvenuti */
function unitaAllaData(p,data){
  var t=0;
  lottiDi(p).forEach(function(l){ if(!data || !l.data || l.data<=data) t+=l.q; });
  return t;
}
/* toglie q unita' in proporzione da tutti gli acquisti, restituendo i lotti staccati */
function staccaQuota(p,q){
  var L=lottiDi(p), tot=0; L.forEach(function(l){tot+=l.q;});
  if(!(tot>0)) return {venduti:[],restanti:L};
  var frazione=Math.min(1,q/tot), venduti=[], restanti=[];
  L.forEach(function(l){
    var presa=l.q*frazione;
    if(presa>1e-9) venduti.push({q:presa,prezzo:l.prezzo,data:l.data,cambio:l.cambio});
    var resta=l.q-presa;
    if(resta>1e-9) restanti.push({q:resta,prezzo:l.prezzo,data:l.data,cambio:l.cambio});
  });
  return {venduti:venduti,restanti:restanti};
}

function blankStore(){var id=uid();return{portfolios:[{id:id,name:"Principale",positions:[],closed:[],dividends:[]}],rates:JSON.parse(JSON.stringify(DEFAULT_RATES)),activeId:id};}

function normalizeStore(obj){
  if(!obj||typeof obj!=="object")return null;
  var src;
  if(Array.isArray(obj.portfolios))src=obj;
  else if(Array.isArray(obj.positions)||Array.isArray(obj.closed)||Array.isArray(obj.dividends))
    src={portfolios:[{id:uid(),name:"Principale",positions:obj.positions||[],closed:obj.closed||[],dividends:obj.dividends||[]}],rates:obj.rates,activeId:null};
  else return null;
  var portfolios=(src.portfolios||[]).map(function(p){
    var pf={id:p.id||uid(),name:p.name||"Portafoglio",positions:p.positions||[],closed:p.closed||[],dividends:p.dividends||[]};
    /* i dati salvati prima degli acquisti multipli diventano blocchi con un solo acquisto */
    pf.positions.forEach(ricalcola); pf.closed.forEach(ricalcola);
    return pf;});
  if(!portfolios.length)portfolios=[{id:uid(),name:"Principale",positions:[],closed:[],dividends:[]}];
  var rates=Object.assign({},DEFAULT_RATES,src.rates||{});
  CURRENCIES.forEach(function(c){var v=num(rates[c]);rates[c]=v>0?v:DEFAULT_RATES[c];});
  rates.EUR=1;
  var activeId=portfolios.some(function(p){return p.id===src.activeId;})?src.activeId:portfolios[0].id;
  return{portfolios:portfolios,rates:rates,activeId:activeId};
}

/* ============ calcolo ============ */
function fx(c){var v=S.rates[c];return v==null?1:v;}
function nomeChiave(x){return String(x||"").trim().toLowerCase();}
function valoreDiv(d){return d.amount*(d.rate==null?fx(d.currency):d.rate);}
function chiaveLotto(p,chiuso){return (chiuso?"c":"o")+p.id;}

/* Ripartizione dei dividendi fra i lotti.
   Ogni incasso viene diviso fra i lotti dello stesso titolo che risultavano
   posseduti alla data in cui e' maturato, in proporzione alle unita' di ciascuno.
   Cosi' vendendo una parte del titolo, la quota corrispondente di cedole segue
   le unita' vendute e il resto continua a maturare su quelle rimaste. */
function elencoLotti(){
  var A=active(), lotti=[];
  A.positions.forEach(function(p){lotti.push({k:chiaveLotto(p,false),r:p,chiuso:false});});
  A.closed.forEach(function(c){lotti.push({k:chiaveLotto(c,true),r:c,chiuso:true});});
  return lotti;
}
/* come si divide un singolo incasso fra i lotti: restituisce chiave lotto -> euro */
function quoteDi(d, lotti){
  lotti=lotti||elencoLotti();
  var nome=nomeChiave(d.name), val=valoreDiv(d), data=d.date||"", out={};
  var idonei=lotti.filter(function(l){
    if(nomeChiave(l.r.name)!==nome) return false;
    if(l.chiuso && data && l.r.sellDate && l.r.sellDate<=data) return false; /* gia' venduto all'incasso */
    return unitaAllaData(l.r,data)>0;   /* conta solo gli acquisti gia' avvenuti a quella data */
  });
  /* ripiego: se nessun lotto risulta posseduto a quella data (per esempio una data
     inserita male), l'incasso non va perso ma si divide fra tutti i lotti del titolo */
  if(!idonei.length) idonei=lotti.filter(function(l){return nomeChiave(l.r.name)===nome;});
  var tot=0; idonei.forEach(function(l){tot+=unitaAllaData(l.r,data);});
  if(!(tot>0)) return out;
  idonei.forEach(function(l){out[l.k]=val*(unitaAllaData(l.r,data)/tot);});
  return out;
}
function ripartizioneDividendi(){
  var lotti=elencoLotti(), mappa={};
  active().dividends.forEach(function(d){
    var q=quoteDi(d,lotti);
    Object.keys(q).forEach(function(k){mappa[k]=(mappa[k]||0)+q[k];});
  });
  return mappa;
}
var _rip=null;
function rip(){ if(!_rip)_rip=ripartizioneDividendi(); return _rip; }
function scadeRip(){ _rip=null; }
function incomeLotto(p,chiuso){ var m=rip(); return m[chiaveLotto(p,chiuso)]||0; }

function metrics(p,closed){
  var price=closed?p.sellPrice:p.currentPrice;
  var endRate=closed?(p.sellRate==null?fx(p.currency):p.sellRate):fx(p.currency);
  var buyRate=p.buyRate==null?1:p.buyRate;
  var end=closed?new Date(p.sellDate):new Date();
  var invested=p.quantity*p.buyPrice*buyRate;
  var value=p.quantity*price*endRate-(closed?(p.tax||0):0);   /* al netto delle tasse indicate alla vendita */
  var capGain=value-invested;
  var income=incomeLotto(p,closed);
  var years=anniPesati(p,end);
  var r=invested>0?capGain/invested:0;
  var rt=invested>0?(capGain+income)/invested:0;
  function tae(base,y){return base<=0?-100:(Math.pow(base,1/y)-1)*100;}
  return{invested:invested,value:value,capGain:capGain,income:income,years:years,
    rendNom:r*100,rendNomTot:rt*100,annLin:(rt/years)*100,annTae:tae(1+rt,years),
    priceAnnLin:(r/years)*100,priceAnnTae:tae(1+r,years),resa:capGain+income};
}
function aggregate(list,closed){
  var inv=0,val=0,cap=0,inc=0,wy=0;
  list.forEach(function(p){var m=metrics(p,closed);inv+=m.invested;val+=m.value;cap+=m.capGain;inc+=m.income;wy+=m.invested*m.years;});
  var years=inv>0?wy/inv:1;
  var rt=inv>0?(cap+inc)/inv:0,r=inv>0?cap/inv:0;
  function tae(base){return base<=0?-100:(Math.pow(base,1/years)-1)*100;}
  return{inv:inv,val:val,cap:cap,inc:inc,years:years,rendNom:r*100,rendNomTot:rt*100,
    annLin:(rt/years)*100,annTae:tae(1+rt),priceAnnLin:(r/years)*100,priceAnnTae:tae(1+r),resa:cap+inc};
}
/* Riferimenti condivisi fra portafoglio attuale e storico, cosi' un voto significa
   la stessa cosa nelle due schermate. Le tre valutazioni sono:
   1) rendimento nominale comprensivo di cedole (%)  2) resa complessiva (euro)
   3) le due precedenti combinate in proporzione ai rispettivi riferimenti */
/* Terza grandezza da valutare: per i titoli tenuti da piu' di un anno il rendimento
   annualizzato lineare comprensivo di cedole, per gli altri il nominale con cedole.
   Sotto l'anno annualizzare gonfierebbe il dato, quindi si resta sul nominale. */
function rendValutabile(m){ return m.years>1 ? m.annLin : m.rendNomTot; }

function dists(){
  var A=active(), c1=[], c2=[], c3=[];
  function raccogli(p,chiuso){
    var m=metrics(p,chiuso), peso=m.invested;
    c1.push({v:m.rendNomTot,peso:peso});
    c2.push({v:m.resa,peso:peso});
    c3.push({v:rendValutabile(m),peso:peso});
  }
  A.positions.forEach(function(p){raccogli(p,false);});
  A.closed.forEach(function(c){raccogli(c,true);});
  return {rend:riferimento(c1), rendAlto:riferimentoAlto(c1),
          resa:riferimento(c2), resaAlto:riferimentoAlto(c2),
          ann:riferimento(c3),  annAlto:riferimentoAlto(c3)};
}
/* Quattro valutazioni: rendimento con cedole, resa in euro, rendimento annualizzato,
   e la media delle tre. */
/* media delle stelle ponderata sul capitale investito di ogni titolo */
/* Valore da mostrare accanto alle stelle: dipende da come sono ordinati i titoli.
   Con ordine alfabetico o per valutazione media non si mostra nulla, perche' il dato
   sarebbe gia' nelle stelle o non avrebbe senso numerico. */
/* Quantita', prezzo unitario e importo complessivo sono legati da quantita' x prezzo = importo.
   Se ne compilano due qualsiasi e il terzo si calcola da solo. Per sapere quale ricalcolare
   si tiene memoria dell'ordine in cui i campi vengono toccati: si rifa' sempre quello
   rimasto indietro, cioe' il piu' vecchio dei tre. */
var campiRecenti=[];
function azzeraCampiRecenti(){ campiRecenti=[]; }
function completaTerzo(idQ,idP,idT,quale){
  var eQ=document.getElementById(idQ), eP=document.getElementById(idP), eT=document.getElementById(idT);
  if(!eQ||!eP||!eT) return;
  campiRecenti=[quale].concat(campiRecenti.filter(function(x){return x!==quale;}));
  var tutti=["qta","prezzo","tot"];
  var pieno={qta:eQ.value.trim()!=="", prezzo:eP.value.trim()!=="", tot:eT.value.trim()!==""};
  var vuoti=tutti.filter(function(x){return !pieno[x];});
  var target=null;
  if(vuoti.length===1){
    target=vuoti[0];              /* due compilati e uno vuoto: si riempie quello vuoto */
  }else if(vuoti.length===0){
    tutti.forEach(function(x){    /* tutti e tre pieni: si rifa' quello toccato meno di recente */
      var pos=campiRecenti.indexOf(x);
      if((pos<0||pos>1)&&target===null) target=x;
    });
  }
  if(!target) return;
  if(target===quale) return;   /* mai riscrivere il campo su cui si sta digitando */
  var q=num(eQ.value), pr=num(eP.value), tot=num(eT.value);
  function scrivi(el,v){
    if(!isFinite(v)||v<=0){ el.value=""; return; }
    el.value=String(Math.round(v*1e6)/1e6).replace(".",",");
  }
  if(target==="tot"    && q>0  && pr>0)  scrivi(eT,q*pr);
  else if(target==="prezzo" && q>0  && tot>0) scrivi(eP,tot/q);
  else if(target==="qta"    && pr>0 && tot>0) scrivi(eQ,tot/pr);
}
function valoreOrdine(campo,m,st,peso){
  switch(campo){
    case "valore": return fmt(m.value);
    case "peso":   return (peso!=null?peso.toFixed(1)+"%":"");
    case "resa":   return fmtSigned(m.resa);
    case "nom":    return pct(m.rendNom);
    case "nomtot": return pct(m.rendNomTot);
    case "annlin": return pct(m.annLin);
    case "data":   return "";
    default:       return "";
  }
}
/* se l'ordinamento e' su una valutazione, le stelle mostrate sono quelle di quella valutazione */
function stelleDaMostrare(campo,st){
  if(campo==="vRend") return st.rend;
  if(campo==="vResa") return st.resa;
  if(campo==="stelle") return st.media;
  return st.ann;   /* di default la valutazione annualizzata */
}
function stelleMedie(lista,chiusi,D){
  if(!lista.length) return null;
  var num={rend:0,resa:0,ann:0,media:0}, den=0;
  lista.forEach(function(p){
    var m=metrics(p,chiusi), st=starsOf(m,D), w=m.invested>0?m.invested:0;
    den+=w;
    ["rend","resa","ann","media"].forEach(function(k){num[k]+=st[k]*w;});
  });
  if(!(den>0)){
    var ar=lista.map(function(p){return starsOf(metrics(p,chiusi),D);});
    return {rend:mean(ar.map(function(x){return x.rend;})),resa:mean(ar.map(function(x){return x.resa;})),
            ann:mean(ar.map(function(x){return x.ann;})),media:mean(ar.map(function(x){return x.media;}))};
  }
  return {rend:num.rend/den,resa:num.resa/den,ann:num.ann/den,media:num.media/den};
}
function starsOf(m,D){
  var a=starsFor(m.rendNomTot,D.rend,D.rendAlto);
  var b=starsFor(m.resa,D.resa,D.resaAlto);
  var c=starsFor(rendValutabile(m),D.ann,D.annAlto);
  return {rend:a, resa:b, ann:c, media:arrotondaStelle((a+b+c)/3)};
}

  '<span class="num starval'+(neg?" neg":"")+'">'+(neg?"\u2212":"")+Math.abs(v).toFixed(1)+'/10</span></span>';

function row(k,v,color){

/* ============ grafici SVG ============ */
function donut(items,title,id){
  var tot=0;items.forEach(function(d){tot+=d.value;});
  if(!(tot>0))return"";
  var cx=90,cy=90,R=78,IR=48,a=-Math.PI/2,out="";
  if(items.length===1){
    out='<circle cx="90" cy="90" r="'+((R+IR)/2)+'" fill="none" stroke="'+items[0].color+'" stroke-width="'+(R-IR)+'"/>';
  }else{
    items.forEach(function(d){
      var ang=d.value/tot*Math.PI*2,b=a+ang-0.02,large=ang>Math.PI?1:0;
      out+='<path d="M'+n2(cx+R*Math.cos(a))+' '+n2(cy+R*Math.sin(a))+
      ' A'+R+' '+R+' 0 '+large+' 1 '+n2(cx+R*Math.cos(b))+' '+n2(cy+R*Math.sin(b))+
      ' L'+n2(cx+IR*Math.cos(b))+' '+n2(cy+IR*Math.sin(b))+
      ' A'+IR+' '+IR+' 0 '+large+' 0 '+n2(cx+IR*Math.cos(a))+' '+n2(cy+IR*Math.sin(a))+' Z" fill="'+d.color+'"/>';
      a+=ang;});
  }
  var leg=items.map(function(d){
    return '<div class="leg"><span class="dot" style="background:'+d.color+'"></span>'+esc(d.name)+
    ' \u00b7 '+Math.round(d.value/tot*100)+'% \u00b7 <span class="num">'+fmt(d.value)+'</span></div>';}).join("");
  return scheda(id, title,
    '<svg viewBox="0 0 180 180" width="100%" height="190" preserveAspectRatio="xMidYMid meet">'+out+'</svg>'+
    '<div class="legend">'+leg+'</div>');
}

/* Barre sovrapposte: ogni voce ha due componenti, la parte di prezzo (a) e le cedole (b).
   Se b manca, la barra resta a un solo colore come prima. */
function bars(items,unit,title,id){
  if(!items.length)return"";
  var dueParti=items.some(function(d){return Math.abs(d.b||0)>0.0001;});
  var LW=100,W=380,rowH=34,H=items.length*rowH+14,BW=W-LW-6;
  var RIS=62;   /* spazio riservato all'etichetta del valore, cosi' non esce dal riquadro */
  var estremo=function(d){
    var a=d.a||0,b=d.b||0;
    return Math.max(Math.abs(a), Math.abs(a>0?a+b:b), Math.abs(a+b));
  };
  var maxAbs=0;items.forEach(function(d){maxAbs=Math.max(maxAbs,estremo(d));});
  if(!(maxAbs>0))maxAbs=1;
  var hasNeg=items.some(function(d){return (d.a||0)<0;});
  var zero=hasNeg?LW+BW/2:LW;
  var spazio=(hasNeg?BW/2:BW)-RIS;
  var scale=spazio>0?spazio/maxAbs:0;
  var out='<line x1="'+zero+'" y1="4" x2="'+zero+'" y2="'+(H-8)+'" stroke="#2A3341" stroke-width="1"/>';
  items.forEach(function(d,i){
    var a=d.a||0, b=d.b||0, tot=a+b;
    var y=8+i*rowH;
    var lbl=d.name.length>15?d.name.slice(0,14)+"\u2026":d.name;
    out+='<text x="'+(LW-8)+'" y="'+(y+12)+'" text-anchor="end" font-size="10.5" fill="#8B94A6">'+esc(lbl)+'</text>';
    var destra=zero, sinistra=zero;   /* i due fronti da cui far crescere i segmenti */
    function segmento(v,colore){
      if(Math.abs(v)<0.0001) return;
      var w=Math.abs(v)*scale, x;
      if(v<0){ sinistra-=w; x=sinistra; } else { x=destra; destra+=w; }
      out+='<rect x="'+n2(x)+'" y="'+y+'" width="'+n2(Math.max(w,1.5))+'" height="16" rx="2.5" fill="'+colore+'"/>';
    }
    segmento(a, a<0?"#DC7A6B":"#4FB286");
    if(dueParti) segmento(b, "#C9A24B");
    var val=unit==="pct"?pct(tot):fmtSigned(tot);
    var fine=tot<0?sinistra:destra, ancora=tot<0?"end":"start";
    out+='<text x="'+n2(tot<0?fine-5:fine+5)+'" y="'+(y+12)+'" text-anchor="'+ancora+
    '" font-size="9.5" fill="'+(tot>=0?"#4FB286":"#DC7A6B")+'" font-family="ui-monospace,Menlo,monospace">'+esc(val)+'</text>';
  });
  var legenda = dueParti ? '<div class="legend">'+
    '<div class="leg"><span class="dot" style="background:#4FB286"></span>plusvalenza</div>'+
    '<div class="leg"><span class="dot" style="background:#DC7A6B"></span>minusvalenza</div>'+
    '<div class="leg"><span class="dot" style="background:#C9A24B"></span>cedole e dividendi</div></div>' : "";
  return scheda(id, title,
    '<svg viewBox="0 0 '+W+' '+H+'" width="100%" preserveAspectRatio="xMidYMid meet">'+out+'</svg>'+legenda);
}

/* contenitore di un grafico, richiudibile toccando il titolo */
function scheda(id, titolo, contenuto){

    '<div class="chart-head"'+(id?' data-act="toggleChart" data-v="'+id+'"':'')+'>'+
      '<div class="chart-title">'+esc(titolo)+'</div>'+
      (id?'<span class="chev'+(chiuso?"":" giu")+'">'+ic("chevron",15)+'</span>':'')+
    '</div>'+
    (chiuso?'':contenuto)+'</div>';
}

function radar(items,unit,title,id){
  /* Mostra sempre tutte le categorie, cosi' il confronto fra portafogli resta stabile.
     "Altro" compare solo se davvero usata. Lo zero non sta al centro ma a un quinto
     del raggio: dentro quell'anello finiscono i valori negativi. */
  var mappa={}; items.forEach(function(d){mappa[d.name]=d.value;});
  var cat=TYPES.filter(function(t){return t!=="Altro"||mappa.hasOwnProperty("Altro");});
  var dati=cat.map(function(t){return {name:t, value:mappa.hasOwnProperty(t)?mappa[t]:null};});
  var N=dati.length; if(N<3) return "";
  var presenti=dati.filter(function(d){return d.value!==null;});
  if(!presenti.length) return "";
  var cx=152,cy=120,R=76,Z=R/5;   /* Z = raggio della circonferenza dello zero */
  var vals=presenti.map(function(d){return d.value;});
  var mx=Math.max.apply(null,vals), mn=Math.min.apply(null,vals);
  var posMax=Math.max(mx,0)||1, negMin=Math.min(mn,0);
  function rr(v){
    if(v===null) return Z;
    if(v>=0) return Z+(R-Z)*(posMax>0?Math.min(1,v/posMax):0);
    return negMin<0 ? Z*(1-Math.min(1,v/negMin)) : Z;
  }
  function pt(i,r){var a=-Math.PI/2+i/N*Math.PI*2;return[n2(cx+r*Math.cos(a)),n2(cy+r*Math.sin(a))];}
  var out="";
  [0.4,0.6,0.8,1].forEach(function(f){
    var pts=[];for(var i=0;i<N;i++)pts.push(pt(i,Z+(R-Z)*f).join(","));
    out+='<polygon points="'+pts.join(" ")+'" fill="none" stroke="#2A3341" stroke-width="1"/>';});
  for(var i=0;i<N;i++){var q=pt(i,R);out+='<line x1="'+cx+'" y1="'+cy+'" x2="'+q[0]+'" y2="'+q[1]+'" stroke="#2A3341"/>';}
  /* ragnatela rossa dello zero */
  var zp=[];for(var z=0;z<N;z++)zp.push(pt(z,Z).join(","));
  out+='<polygon points="'+zp.join(" ")+'" fill="none" stroke="#DC7A6B" stroke-width="1.4" stroke-dasharray="3 2.5" opacity="0.85"/>';
  /* area dei dati: le categorie senza titoli restano appoggiate allo zero */
  var dp=[];for(var j2=0;j2<N;j2++)dp.push(pt(j2,rr(dati[j2].value)).join(","));
  out+='<polygon points="'+dp.join(" ")+'" fill="#C9A24B" fill-opacity="0.28" stroke="#C9A24B" stroke-width="1.6"/>';
  for(var k2=0;k2<N;k2++){
    var q2=pt(k2,R+16),a2=-Math.PI/2+k2/N*Math.PI*2,co=Math.cos(a2);
    var anch=co>0.3?"start":(co<-0.3?"end":"middle");
    var nm=dati[k2].name.length>12?dati[k2].name.slice(0,11)+"\u2026":dati[k2].name;
    var vuota=dati[k2].value===null;
    out+='<text x="'+q2[0]+'" y="'+(q2[1]+3)+'" text-anchor="'+anch+'" font-size="9.5" fill="'+(vuota?"#4a525f":"#8B94A6")+'">'+esc(nm)+'</text>';
    if(!vuota){
      var pv=pt(k2,rr(dati[k2].value));
      out+='<circle cx="'+pv[0]+'" cy="'+pv[1]+'" r="2.6" fill="'+(dati[k2].value<0?"#DC7A6B":"#C9A24B")+'"/>';
    }
  }
  var legenda='<div class="legend"><div class="leg"><span class="dot" style="background:#DC7A6B"></span>linea dello zero</div>'+
    (negMin<0?'<div class="leg">dentro la linea rossa = valori negativi</div>':"")+'</div>';
  return scheda(id, title,
    '<svg viewBox="0 0 304 244" width="100%" preserveAspectRatio="xMidYMid meet">'+out+'</svg>'+legenda);
}

function graficiPortafoglio(lista, chiusi, prefisso){
  if(!lista.length) return "";
  var byType={};
  lista.forEach(function(p){byType[p.type]=(byType[p.type]||0)+metrics(p,chiusi).value;});
  var comp=Object.keys(byType).filter(function(k){return byType[k]>0;}).map(function(k){return{name:k,value:byType[k],color:TYPE_COLORS[k]||"#8B94A6"};});
  var g={};
  lista.forEach(function(p){var m=metrics(p,chiusi);(g[p.type]=g[p.type]||[]).push(m);});
  /* rendimento annualizzato lineare comprensivo di cedole, medio per categoria,
     scomposto nella parte di prezzo e in quella delle cedole */
  var catRet=Object.keys(g).map(function(k){
    var quota=function(m){return m.years>0?m.years:1;};
    return{name:k, a:n2(mean(g[k].map(function(m){return m.invested>0?(m.capGain/m.invested)/quota(m)*100:0;}))),
                   b:n2(mean(g[k].map(function(m){return m.invested>0?(m.income/m.invested)/quota(m)*100:0;})))};});
  var catResaTot=Object.keys(g).map(function(k){
    return{name:k, a:Math.round(g[k].reduce(function(s,m){return s+m.capGain;},0)),
                   b:Math.round(g[k].reduce(function(s,m){return s+m.income;},0))};});
  var catResaAvg=Object.keys(g).map(function(k){
    return{name:k, a:Math.round(mean(g[k].map(function(m){return m.capGain;}))),
                   b:Math.round(mean(g[k].map(function(m){return m.income;})))};});
  var perTitleRet=lista.map(function(p){var m=metrics(p,chiusi), y=m.years>0?m.years:1;
    return{name:p.name, a:n2(m.invested>0?(m.capGain/m.invested)/y*100:0),
                        b:n2(m.invested>0?(m.income/m.invested)/y*100:0)};});
  var perTitleResa=lista.map(function(p){var m=metrics(p,chiusi);
    return{name:p.name, a:Math.round(m.capGain), b:Math.round(m.income)};});
  var radRet=Object.keys(g).map(function(k){return{name:k,value:n2(mean(g[k].map(function(m){return m.rendNomTot;})))};});
  var radResa=Object.keys(g).map(function(k){return{name:k,value:Math.round(g[k].reduce(function(s,m){return s+m.resa;},0))};});
  var Dv=dists();
  /* valutazione media per categoria, ponderata sul capitale investito */
  var radVoto=Object.keys(g).map(function(k){
    var num=0,den=0;
    g[k].forEach(function(m){var w=m.invested>0?m.invested:0;num+=starsOf(m,Dv).media*w;den+=w;});
    return{name:k, value:n2(den>0?num/den:mean(g[k].map(function(m){return starsOf(m,Dv).media;})))};});
  var x=prefisso;
  return donut(comp,"Composizione per tipo",x+"comp")+
    radar(radVoto,"voto","Valutazione media ponderata per categoria (stelle)",x+"radvoto")+
    radar(radRet,"pct","Rendimento compr. medio per categoria (%)",x+"radret")+
    bars(catRet,"pct","Rend. annualizzato medio per categoria (%)",x+"catret")+
    radar(radResa,"eur","Resa effettiva per categoria (\u20ac)",x+"radresa")+
    bars(catResaTot,"eur","Resa totale per categoria (\u20ac)",x+"catresa")+
    bars(catResaAvg,"eur","Resa media per categoria (\u20ac)",x+"catresamed")+
    bars(perTitleRet,"pct","Rend. annualizzato per titolo (%)",x+"titret")+
    bars(perTitleResa,"eur","Resa economica per titolo (\u20ac)",x+"titresa");
}

function inRange(d,from,to){return(!from||d>=from)&&(!to||d<=to);}
function screenRep(){
  var A=active();
  var ys={};
  A.positions.forEach(function(p){if(p.buyDate)ys[p.buyDate.slice(0,4)]=1;});
  A.closed.forEach(function(c){if(c.sellDate)ys[c.sellDate.slice(0,4)]=1;});
  A.dividends.forEach(function(x){if(x.date)ys[x.date.slice(0,4)]=1;});
  var years=Object.keys(ys).sort().reverse();
  var pFrom="",pTo="";
  if(REP.period==="custom"){pFrom=REP.from;pTo=REP.to;}
  else if(REP.period!=="all"){pFrom=REP.period+"-01-01";pTo=REP.period+"-12-31";}

  var useOpen=REP.scope!=="hist",useClosed=REP.scope!=="att";
  var invested=0,curVal=0,plus=0,income=0,resa=0,count=0,catResa={};
  if(useOpen)A.positions.filter(function(p){return inRange(p.buyDate,pFrom,pTo);}).forEach(function(p){
    var m=metrics(p,false);invested+=m.invested;curVal+=m.value;plus+=m.capGain;resa+=m.capGain;count++;
    catResa[p.type]=catResa[p.type]||{a:0,b:0}; catResa[p.type].a+=m.capGain;});
  if(useClosed)A.closed.filter(function(c){return inRange(c.sellDate,pFrom,pTo);}).forEach(function(c){
    var m=metrics(c,true);invested+=m.invested;curVal+=m.value;plus+=m.capGain;resa+=m.capGain;count++;
    catResa[c.type]=catResa[c.type]||{a:0,b:0}; catResa[c.type].a+=m.capGain;});
  var inScope={};
  if(useOpen)A.positions.filter(function(x){return inRange(x.buyDate,pFrom,pTo);}).forEach(function(x){inScope[chiaveLotto(x,false)]=1;});
  if(useClosed)A.closed.filter(function(x){return inRange(x.sellDate,pFrom,pTo);}).forEach(function(x){inScope[chiaveLotto(x,true)]=1;});
  var lottiRep=elencoLotti(), tipoLotto={};
  lottiRep.forEach(function(l){tipoLotto[l.k]=l.r.type;});
  A.dividends.filter(function(x){return inRange(x.date,pFrom,pTo);}).forEach(function(x){
    /* di ogni incasso conta solo la parte attribuita ai lotti compresi nel periodo e nella vista */
    var q=quoteDi(x,lottiRep), v=0;
    Object.keys(q).forEach(function(k){
      if(!inScope[k])return;
      v+=q[k];
      var t=tipoLotto[k]; if(t){ catResa[t]=catResa[t]||{a:0,b:0}; catResa[t].b+=q[k]; }
    });
    income+=v;resa+=v;});
  var totRet=invested>0?(plus+income)/invested*100:0;
  var catRows=Object.keys(catResa).filter(function(k){return k;}).map(function(k){
    return{name:k, a:Math.round(catResa[k].a), b:Math.round(catResa[k].b)};});

  var h='<div class="seg">'+
  [["att","Attuale"],["hist","Storico"],["both","Entrambi"]].map(function(o){
    return '<button data-act="repScope" data-v="'+o[0]+'" class="'+(REP.scope===o[0]?"on":"")+'">'+o[1]+'</button>';}).join("")+'</div>';
  h+='<div class="chips"><div class="pchip'+(REP.period==="all"?" on":"")+'" data-act="repPeriod" data-v="all">Tutto</div>'+
  years.map(function(y){return '<div class="pchip'+(REP.period===y?" on":"")+'" data-act="repPeriod" data-v="'+y+'">'+y+'</div>';}).join("")+
  '<div class="pchip'+(REP.period==="custom"?" on":"")+'" data-act="repPeriod" data-v="custom">Periodo\u2026</div></div>';
  if(REP.period==="custom"){
    h+='<div class="row2" style="margin-bottom:14px">'+
    '<div class="field"><label class="label">Dal</label><input class="input" type="date" id="repFrom" value="'+esc(REP.from)+'" data-act="repDates"></div>'+
    '<div class="field"><label class="label">Al</label><input class="input" type="date" id="repTo" value="'+esc(REP.to)+'" data-act="repDates"></div></div>';
  }
  h+='<div class="summary"><div class="sum-label">Resa effettiva del periodo</div>'+
  '<div class="sum-value num" style="color:'+upc(resa)+'">'+fmtSigned(resa)+'</div>'+
  '<div class="sum-chip" style="color:var(--muted)">'+count+' titoli \u00b7 rend. totale '+pct(totRet)+'</div>'+
  '<div class="ledger">'+row("Capitale investito",fmt(invested))+row("Valore / incassato",fmt(curVal))+
  row("Plus / minusvalenza",fmtSigned(plus),upc(plus))+row("Cedole e dividendi",fmt(income),"var(--up)")+'</div></div>';
  if(catRows.length){
    h+='<div class="sec-label">'+ic("pie",13)+' Resa per categoria</div>'+bars(catRows,"eur","Resa del periodo per categoria (\u20ac)","r-cat");
  }
  /* stessi grafici del portafoglio, ma solo sui titoli che rientrano nel periodo e nella vista scelti */
  var listaRep=[]; 
  if(useOpen)A.positions.filter(function(p){return inRange(p.buyDate,pFrom,pTo);}).forEach(function(p){listaRep.push({p:p,chiuso:false});});
  if(useClosed)A.closed.filter(function(c){return inRange(c.sellDate,pFrom,pTo);}).forEach(function(c){listaRep.push({p:c,chiuso:true});});
  if(listaRep.length){
    h+='<div class="sec-label"><span class="sec-toggle" data-act="toggleSez" data-v="graficiR">'+ic("pie",13)+
      ' Grafici del periodo<span class="chev'+(UI.graficiR?" giu":"")+'">'+ic("chevron",14)+'</span></span></div>';
    if(UI.graficiR) h+=graficiMisti(listaRep,"r-");
  }
  return h;
}

/* come graficiPortafoglio, ma su una lista mista di titoli aperti e chiusi (per i resoconti) */
function graficiMisti(voci, prefisso){
  if(!voci.length) return "";
  var M=voci.map(function(v){return {p:v.p, m:metrics(v.p,v.chiuso)};});
  var byType={}; M.forEach(function(o){byType[o.p.type]=(byType[o.p.type]||0)+o.m.value;});
  var comp=Object.keys(byType).filter(function(k){return byType[k]>0;}).map(function(k){return{name:k,value:byType[k],color:TYPE_COLORS[k]||"#8B94A6"};});
  var g={}; M.forEach(function(o){(g[o.p.type]=g[o.p.type]||[]).push(o.m);});
  var catRet=Object.keys(g).map(function(k){
    var qy=function(m){return m.years>0?m.years:1;};
    return{name:k, a:n2(mean(g[k].map(function(m){return m.invested>0?(m.capGain/m.invested)/qy(m)*100:0;}))),
                   b:n2(mean(g[k].map(function(m){return m.invested>0?(m.income/m.invested)/qy(m)*100:0;})))};});
  var catResaTot=Object.keys(g).map(function(k){return{name:k, a:Math.round(g[k].reduce(function(s,m){return s+m.capGain;},0)),
    b:Math.round(g[k].reduce(function(s,m){return s+m.income;},0))};});
  var catResaAvg=Object.keys(g).map(function(k){return{name:k, a:Math.round(mean(g[k].map(function(m){return m.capGain;}))),
    b:Math.round(mean(g[k].map(function(m){return m.income;})))};});
  var perTitleRet=M.map(function(o){var y=o.m.years>0?o.m.years:1;
    return{name:o.p.name, a:n2(o.m.invested>0?(o.m.capGain/o.m.invested)/y*100:0),
                          b:n2(o.m.invested>0?(o.m.income/o.m.invested)/y*100:0)};});
  var perTitleResa=M.map(function(o){return{name:o.p.name, a:Math.round(o.m.capGain), b:Math.round(o.m.income)};});
  var radRet=Object.keys(g).map(function(k){return{name:k,value:n2(mean(g[k].map(function(m){return m.rendNomTot;})))};});
  var radResa=Object.keys(g).map(function(k){return{name:k,value:Math.round(g[k].reduce(function(s,m){return s+m.resa;},0))};});
  var Dv=dists();
  /* valutazione media per categoria, ponderata sul capitale investito */
  var radVoto=Object.keys(g).map(function(k){
    var num=0,den=0;
    g[k].forEach(function(m){var w=m.invested>0?m.invested:0;num+=starsOf(m,Dv).media*w;den+=w;});
    return{name:k, value:n2(den>0?num/den:mean(g[k].map(function(m){return starsOf(m,Dv).media;})))};});
  var x=prefisso;
  return donut(comp,"Composizione per tipo",x+"comp")+
    radar(radVoto,"voto","Valutazione media ponderata per categoria (stelle)",x+"radvoto")+
    radar(radRet,"pct","Rendimento compr. medio per categoria (%)",x+"radret")+
    bars(catRet,"pct","Rend. annualizzato medio per categoria (%)",x+"catret")+
    radar(radResa,"eur","Resa effettiva per categoria (\u20ac)",x+"radresa")+
    bars(catResaTot,"eur","Resa totale per categoria (\u20ac)",x+"catresatot")+
    bars(catResaAvg,"eur","Resa media per categoria (\u20ac)",x+"catresamed")+
    bars(perTitleRet,"pct","Rend. annualizzato per titolo (%)",x+"titret")+
    bars(perTitleResa,"eur","Resa economica per titolo (\u20ac)",x+"titresa");
}

/* ============ render principale ============ */

   a destra. In verticale, e su telefono, resta il layout a colonna singola. */
function grande(){
  try{ return window.matchMedia("(min-width:1000px) and (orientation:landscape)").matches; }
  catch(e){ return false; }
}
var SEL=null;   /* titolo selezionato nella colonna di dettaglio */

  if(!SEL) return false;

}
function pannelloDettaglio(){
  if(TAB==="att"||TAB==="hist"){

        var p=findPos(SEL.id);
        return '<div class="det-head"><div><div class="det-title">'+esc(p.name)+badge(p.type)+'</div>'+

/* gli acquisti che compongono il titolo, con la loro durata e il loro peso */
function elencoAcquisti(p){
  var L=lottiDi(p); if(!L.length) return "";
  var oggi=new Date(), inv=0;
  L.forEach(function(l){inv+=investitoLotto(l);});
  var righe=L.slice().sort(function(a,b){return (a.data||"")<(b.data||"")?-1:1;}).map(function(l,i){
    var q=investitoLotto(l);
    var anni=Math.max(1/365.25,(oggi-new Date(l.data))/86400000/365.25);
    var idx=lottiDi(p).indexOf(l);
    return '<div class="acq" data-act="apriAcq" data-id="'+p.id+'" data-v="'+idx+'">'+
      '<div class="acq-top"><span class="num">'+fmtNum(l.q)+' unit\u00e0 a '+fmtPrezzo(l.prezzo)+' '+esc(p.currency)+'</span>'+
      '<span class="num" style="color:var(--muted)">'+fmt(q)+'</span></div>'+
      '<div class="acq-sub"><span>'+dLabel(l.data)+' \u00b7 da '+(anni<1?Math.round(anni*365.25)+" giorni":anni.toFixed(1)+" anni")+'</span>'+
      '<span>'+(inv>0?Math.round(q/inv*100):0)+'% del capitale</span></div></div>';
  }).join("");
  return '<div class="sec-label" style="margin:20px 4px 8px">'+ic("layers",13)+' Acquisti ('+L.length+')'+
    '<button class="sortbtn" data-act="nuovoAcq" data-id="'+p.id+'">'+ic("plus",12)+'Aggiungi</button></div>'+righe+
    (L.length>1?'<div class="hint">Prezzo di carico medio '+(Math.round(p.buyPrice*1e4)/1e4)+' '+esc(p.currency)+
      '. I rendimenti annualizzati e le stelle pesano ogni acquisto per il capitale e per il tempo in cui l\'hai tenuto.</div>':"")+
    '<div style="height:1px;background:var(--line);margin:14px 0"></div>';
}
/* Corpo della scheda di un titolo: usato sia nel pannello che sale dal basso sul telefono,
   sia nella colonna di dettaglio sempre visibile su iPad. */
function sottotitoloPos(p){
  return fmtNum(p.quantity)+" unit\u00e0 \u00b7 carico "+fmtPrezzo(p.buyPrice)+" "+esc(p.currency)+" \u00b7 dal "+dLabel(p.buyDate);
}
function corpoPos(p){
  var m=metrics(p,false), st=starsOf(m,dists());
  var tot=aggregate(active().positions,false).val;
  var peso=tot>0?(m.value/tot*100):0;
  return '<div style="display:flex;justify-content:flex-end;margin-bottom:-4px"><button class="starbtn" data-act="openLegend">'+ic("info",14)+' Legenda stelle</button></div>'+
    detailRows(m,st,peso,p.currentPrice,p.currency,false,0,p.quantity,p.buyPrice)+
    elencoAcquisti(p)+
    '<div class="actions" style="margin-top:16px">'+
    '<button class="act" data-act="posPrice" data-id="'+p.id+'">'+ic("refresh",19)+' Aggiorna prezzo attuale</button>'+
    '<button class="act" data-act="posDiv" data-id="'+p.id+'">'+ic("coins",19)+' Registra dividendo / cedola</button>'+
    '<button class="act" data-act="posSell" data-id="'+p.id+'">'+ic("check",19)+' Vendi / chiudi posizione</button>'+
    '<button class="act" data-act="posEdit" data-id="'+p.id+'">'+ic("pencil",19)+' Modifica dati</button>'+
    '<button class="act danger" data-act="posDelAsk" data-id="'+p.id+'">'+ic("trash",19)+' Elimina</button></div>';
}
function sottotitoloChiuso(c){
  return "Chiuso il "+dLabel(c.sellDate)+" \u00b7 "+fmtNum(c.quantity)+" unit\u00e0";
}
function corpoChiuso(c){
  return detailRows(metrics(c,true),starsOf(metrics(c,true),dists()),null,c.sellPrice,c.currency,true,c.tax||0,c.quantity,c.buyPrice)+
    '<button class="btn btn-danger" data-act="closedDel" data-id="'+c.id+'">Elimina dallo storico</button>';
}
function detailRows(m,st,peso,prezzo,valuta,chiuso,tasse,qta,prezzoAcq){
  return '<div class="ledger">'+
  (qta!=null?row("Quantit\u00e0",fmtNum(qta)+" unit\u00e0"):"")+
  (prezzoAcq!=null?row(chiuso?"Prezzo medio di acquisto":"Prezzo di carico medio",fmtPrezzo(prezzoAcq)+" "+esc(valuta||"EUR")):"")+
  row("Importo investito",fmt(m.invested))+
  (prezzo!=null?row(chiuso?"Prezzo di vendita":"Prezzo corrente",fmtPrezzo(prezzo)+" "+esc(valuta||"EUR")):"")+
  row(chiuso?"Incassato netto":"Valore attuale",fmt(m.value))+
  (tasse>0?row("di cui tasse pagate","\u2212"+fmt(tasse),"var(--down)"):"")+
  (peso!=null?row("Peso nel portafoglio",peso.toFixed(1)+"%","var(--brass)"):"")+
  row("Plus / minusvalenza",fmtSigned(m.capGain),upc(m.capGain))+
  row("Rendimento nominale",pct(m.rendNom),upc(m.rendNom))+
  row("Cedole e dividendi maturati",fmt(m.income),"var(--up)")+
  row("Rend. nominale con cedole/div.",pct(m.rendNomTot),upc(m.rendNomTot))+
  row("Rend. annualizzato compr. (lin. / TAE)",pct(m.annLin)+" / "+pct(m.annTae),upc(m.annLin))+
  row("Resa effettiva complessiva",fmtSigned(m.resa),upc(m.resa))+
  (st?rowRaw("Rendimento con cedole",stars(st.rend),"head-row")+rowRaw("Resa complessiva",stars(st.resa))+rowRaw("Rendimento annualizzato",stars(st.ann))+rowRaw("Valutazione media",stars(st.media)):"")+
  '</div>';
}

    '<button class="btn btn-primary" data-act="saveDiv">Salva</button>';

    '<button class="btn btn-primary" data-act="salvaAcq" data-id="'+pa.id+'" data-v="'+idx+'">Salva</button>'+
    (nuovoAcq||lottiDi(pa).length<2?"":
      '<button class="btn btn-danger" data-act="eliminaAcq" data-id="'+pa.id+'" data-v="'+idx+'">Elimina questo acquisto</button>')+
    (nuovoAcq?"":'<div class="hint" style="margin-top:10px">Per togliere unit\u00e0 vendendole usa invece Vendi, cos\u00ec l\'operazione finisce nello storico.</div>');

    function f(x,u){return u==="\u20ac"?Math.round(x)+" \u20ac":x.toFixed(2)+"%";}
    h=sheetHead("Come leggere le stelle","Da \u221210 a +10, lineare sotto le 5 e gaussiana sopra")+
    '<div class="hint">Zero stelle significa esattamente zero: n\u00e9 guadagno n\u00e9 perdita. '+
    'Fino a cinque stelle la scala sale in modo lineare e le cinque stelle corrispondono alla media dei soli titoli in guadagno. '+
    'Da cinque a dieci la scala segue una curva gaussiana: le dieci stelle spettano al risultato migliore del portafoglio, '+
    'escludendo il 2% dei risultati pi\u00f9 alti, cos\u00ec un singolo caso eccezionale non schiaccia tutti gli altri. '+
    'Salire oltre le cinque stelle \u00e8 quindi via via pi\u00f9 difficile. '+
    'Sotto lo zero vale la stessa identica curva col segno meno e le stelle diventano rosse. '+
    'I riferimenti si ricalcolano da soli e valgono sia per il portafoglio attuale sia per lo storico.</div>'+
    rows.map(function(r){
      var mu=r[1], alto=r[2], u=r[3];
      if(!(mu>0)) return '<div style="margin-bottom:16px"><div style="font-size:13px;font-weight:600;margin-bottom:6px">'+r[0]+'</div>'+
        '<div class="hint" style="margin:0">Nessun titolo in guadagno: la scala non \u00e8 ancora calibrata.</div></div>';
      var top=(alto>mu*1.0001)?alto:mu*2;
      /* valore corrispondente a 2,5 / 5 / 7,5 / 10 stelle, letto sulla curva reale */
      function inverso(target){
        if(target<=5) return mu*target/5;
        var lo=mu, hi=top;
        for(var i=0;i<40;i++){var mid=(lo+hi)/2; if(curvaStelle(mid,mu,alto)<target) lo=mid; else hi=mid;}
        return (lo+hi)/2;

      '<tbody><tr><td>Valore</td><td class="num">'+f(inverso(2.5),u)+'</td><td class="num">'+f(mu,u)+'</td>'+
      '<td class="num">'+f(inverso(7.5),u)+'</td><td class="num">'+f(top,u)+'</td></tr>'+
      '<tr><td>In negativo</td><td class="num" style="color:var(--down)">'+f(-inverso(2.5),u)+'</td>'+
      '<td class="num" style="color:var(--down)">'+f(-mu,u)+'</td>'+
      '<td class="num" style="color:var(--down)">'+f(-inverso(7.5),u)+'</td>'+
      '<td class="num" style="color:var(--down)">'+f(-top,u)+'</td></tr></tbody></table></div>';
    }).join("")+
    '<div class="hint">La terza valutazione non \u00e8 la media delle due stelle: rapporta ciascun valore al proprio '+
    'riferimento, fa la media dei due rapporti e poi applica la stessa curva.</div>';

    if(PF_MODE&&PF_MODE.type==="delete"){
      var t=null;S.portfolios.forEach(function(p){if(p.id===PF_MODE.id)t=p;});
      h+='<div style="margin-top:12px"><div class="hint">Eliminare \u00ab'+esc(t?t.name:"")+'\u00bb e tutti i suoi dati? Non \u00e8 reversibile.</div>'+
      '<button class="btn btn-danger" data-act="pfDel" data-id="'+PF_MODE.id+'">Elimina portafoglio</button>'+
      '<button class="btn btn-ghost" data-act="pfCancel">Annulla</button></div>';
    }else if(PF_MODE){
      h+='<div style="margin-top:12px"><div class="field"><label class="label">'+(PF_MODE.type==="add"?"Nome nuovo portafoglio":"Rinomina portafoglio")+'</label>'+
      '<input class="input" id="pf_name" value="'+esc(PF_MODE.name||"")+'" placeholder="Es. PAC ETF"></div>'+
      '<button class="btn btn-primary" data-act="pfConfirm">'+(PF_MODE.type==="add"?"Crea":"Salva")+'</button>'+
      '<button class="btn btn-ghost" data-act="pfCancel">Annulla</button></div>';
    }else{
      h+='<button class="act" style="margin-top:4px" data-act="pfAddAsk">'+ic("plus",19)+' Nuovo portafoglio</button>';
    }
    h+='<div style="height:1px;background:var(--line);margin:16px 0"></div>'+
    '<button class="act" data-act="openBackup">'+ic("save",19)+' Backup e ripristino</button>';
  }
  else if(k==="backup"){
    h=sheetHead("Backup e ripristino","Esporta o ricarica tutti i tuoi portafogli")+
    '<div class="actions">'+
    '<button class="act" data-act="bkCopy">'+ic("copy",19)+' Copia backup negli appunti</button>'+
    '<button class="act" data-act="bkPaste">'+ic("paste",19)+' Ripristina dagli appunti</button>'+
    '<button class="act" data-act="bkExport">'+ic("download",19)+' Salva file .json</button>'+
    '<button class="act" data-act="bkImport">'+ic("upload",19)+' Carica file .json\u2026</button></div>'+
    (PENDING?'<div style="margin-top:14px"><div class="hint">Trovati '+PENDING.portfolios.length+
    ' portafogli nel backup. Caricandolo sostituisci tutti i dati attuali.</div>'+
    '<button class="btn btn-danger" data-act="bkConfirm">Sostituisci con il backup</button>'+
    '<button class="btn btn-ghost" data-act="bkCancel">Annulla</button></div>':"")+
    '<div class="hint" style="margin-top:14px">Su iPhone il modo pi\u00f9 comodo \u00e8 copiare negli appunti e incollare il testo in una nota o in una mail a te stesso. '+
    'Il backup contiene titoli, dividendi, storico, cambi e tutti i portafogli.</div>';
  }
  root.innerHTML=sheet(h);
  if(MODAL.kind==="sell")sellCalc();
}

/* ============ toast ============ */
var toastT=null;
function toast(msg){
  var r=document.getElementById("toastRoot");
  r.innerHTML='<div class="toast">'+esc(msg)+'</div>';
  clearTimeout(toastT);
  toastT=setTimeout(function(){r.innerHTML="";},2600);
}

/* ============ azioni ============ */
function updateActive(fn){
  S.portfolios=S.portfolios.map(function(p){return p.id===active().id?fn(p):p;});
  save();
}
function sellCalc(){
  var p=findPos(MODAL.id);if(!p)return;
  var qEl=document.getElementById("s_qty");
  var q=qEl?num(qEl.value):p.quantity;
  var quota=p.quantity>0?Math.max(0,Math.min(1,q/p.quantity)):0;
  var pr=num(document.getElementById("s_price").value);
  var rEl=document.getElementById("s_rate");
  var rt=p.currency!=="EUR"?(rEl?num(rEl.value):1):1;
  var v=(pr*rt-p.buyPrice*(p.buyRate==null?1:p.buyRate))*q;
  var el=document.getElementById("s_res");
  if(el){el.textContent=fmtSigned(v);el.style.color=upc(v);}
  var tEl=document.getElementById("s_tax");
  var tasse=tEl?num(tEl.value):0;
  var netto=v-tasse;
  var nEl=document.getElementById("s_netto");
  if(nEl){nEl.textContent=fmtSigned(netto)+(tasse>0?"  (\u2212"+fmt(tasse)+")":"");nEl.style.color=upc(netto);}
  /* quota di cedole gia' maturate che segue le unita' vendute */
  var ced=incomeLotto(p,false)*quota;
  var dEl=document.getElementById("s_div");
  if(dEl){dEl.textContent=fmt(ced);dEl.style.color="var(--up)";}
  var resta=p.quantity-q;
  var rEl2=document.getElementById("s_resta");
  if(rEl2){
    var ok=q>0&&resta>-1e-9;
    rEl2.textContent=!ok?"quantit\u00e0 non valida":(resta<1e-9?"nessuna unit\u00e0, posizione chiusa":
      fmtNum(resta)+" unit\u00e0 in portafoglio");
    rEl2.style.color=ok?"var(--muted)":"var(--down)";
  }
}

  sellCalc:function(){sellCalc();},

  savePos:function(d){
    var name=document.getElementById("f_name").value.trim();
    var qty=num(document.getElementById("f_qty").value);
    var buy=num(document.getElementById("f_buy").value);
    var totEl=document.getElementById("f_tot");
    var totale=totEl?num(totEl.value):0;
    if(!(buy>0)&&totale>0&&qty>0) buy=totale/qty;          /* prezzo ricavato dall'importo */
    if(!(qty>0)&&totale>0&&buy>0) qty=totale/buy;          /* quantita' ricavata dall'importo */
    if(!name){toast("Manca il nome del titolo");return;}
    if(!(qty>0)){toast("La quantit\u00e0 deve essere maggiore di zero");return;}
    var ccy=document.getElementById("f_ccy").value;
    var rateEl=document.getElementById("f_rate");
    var cambio=ccy!=="EUR"?(num(rateEl&&rateEl.value)||S.rates[ccy]||1):1;
    var lotto={q:qty,prezzo:buy,data:document.getElementById("f_date").value||today(),cambio:cambio};
    var prezzoOggi=num(document.getElementById("f_cur").value)||buy;
    var tipo=document.getElementById("f_type").value;
    var ticker=document.getElementById("f_ticker").value.trim();

    if(d.id){   /* modifica dell'anagrafica: i lotti restano dove sono */
      var vecchio=null;
      active().positions.forEach(function(x){ if(x.id===d.id) vecchio=x.name; });
      var rinominato = vecchio!==null && nomeChiave(vecchio)!==nomeChiave(name);
      var quanti=0;
      updateActive(function(pf){
        pf.positions=pf.positions.map(function(x){
          if(x.id!==d.id) return x;
          var y=Object.assign({},x,{name:name,ticker:ticker,type:tipo,currency:ccy,currentPrice:prezzoOggi});
          return ricalcola(y);
        });
        if(rinominato){
          /* i dividendi seguono il titolo, altrimenti perderebbero il collegamento */
          pf.dividends=pf.dividends.map(function(dv){
            if(nomeChiave(dv.name)!==nomeChiave(vecchio)) return dv;
            quanti++; return Object.assign({},dv,{name:name});
          });
          pf.closed=pf.closed.map(function(cl){
            return nomeChiave(cl.name)===nomeChiave(vecchio)?Object.assign({},cl,{name:name}):cl;
          });
        }
        return pf;});
      MODAL=null;render();
      toast(rinominato&&quanti>0?"Titolo aggiornato, rinominati anche "+quanti+" incassi":"Titolo aggiornato");
      return;
    }
    /* nuovo acquisto: se il titolo c'e' gia', con la stessa valuta, confluisce nel blocco */
    var esistente=null;
    active().positions.forEach(function(x){
      if(nomeChiave(x.name)===nomeChiave(name) && x.currency===ccy) esistente=x;
    });
    if(esistente){
      updateActive(function(pf){
        pf.positions=pf.positions.map(function(x){
          if(x.id!==esistente.id) return x;
          var y=Object.assign({},x,{currentPrice:prezzoOggi});
          y.lotti=lottiDi(x).concat([lotto]);
          return ricalcola(y);
        });
        return pf;});
      MODAL=null;render();
      toast("Aggiunte "+qty+" unit\u00e0 a "+name);
      return;
    }
    var nuovo=ricalcola({id:uid(),name:name,ticker:ticker,type:tipo,currency:ccy,
      currentPrice:prezzoOggi,lotti:[lotto]});
    updateActive(function(pf){pf.positions=pf.positions.concat([nuovo]);return pf;});
    MODAL=null;render();toast("Titolo aggiunto");
  },
  savePrice:function(d){
    var v=num(document.getElementById("f_price").value);
    updateActive(function(pf){pf.positions=pf.positions.map(function(x){return x.id===d.id?Object.assign({},x,{currentPrice:v}):x;});return pf;});
    MODAL=null;render();toast("Prezzo aggiornato");
  },
  sellTutto:function(d){
    var p=findPos(d.id);if(!p)return;
    var qEl=document.getElementById("s_qty");
    if(qEl){qEl.value=String(p.quantity);sellCalc();}
  },
  saveSell:function(d){
    var p=findPos(d.id);if(!p)return;
    var qEl=document.getElementById("s_qty");
    var q=qEl?num(qEl.value):p.quantity;
    if(!(q>0)){toast("La quantit\u00e0 da vendere deve essere maggiore di zero");return;}
    if(q>p.quantity+1e-9){toast("Hai solo "+p.quantity+" unit\u00e0 di questo titolo");return;}
    var price=num(document.getElementById("s_price").value);
    var date=document.getElementById("s_date").value||today();
    var rEl=document.getElementById("s_rate");
    var rate=p.currency!=="EUR"?(num(rEl&&rEl.value)||S.rates[p.currency]||1):1;
    var resta=p.quantity-q, parziale=resta>1e-9;
    /* le unita' vendute vengono prese in proporzione da ogni acquisto, cosi' sia la parte
       venduta sia quella rimasta conservano la loro storia di date e prezzi */
    var taglio=staccaQuota(p,q);
    updateActive(function(pf){
      if(parziale){
        pf.positions=pf.positions.map(function(x){
          if(x.id!==p.id) return x;
          var y=Object.assign({},x); y.lotti=taglio.restanti; return ricalcola(y);
        });
      }else{
        pf.positions=pf.positions.filter(function(x){return x.id!==p.id;});
      }
      var tEl2=document.getElementById("s_tax");
      var chiuso=Object.assign({},p,{sellPrice:price,sellDate:date,sellRate:rate,tax:num(tEl2&&tEl2.value),id:uid()});
      chiuso.lotti=taglio.venduti; ricalcola(chiuso);
      pf.closed=[chiuso].concat(pf.closed);
      return pf;});
    MODAL=null;TAB="hist";render();
    toast(parziale?"Vendute "+fmtNum(q)+" unit\u00e0, ne restano "+fmtNum(resta):"Vendita registrata");
  },
  saveDiv:function(){
    var name=document.getElementById("d_name").value.trim();
    var amt=num(document.getElementById("d_amt").value);
    if(!name){toast("Manca il nome del titolo");return;}
    if(!(amt>0)){toast("L\u2019importo deve essere maggiore di zero");return;}
    var ccy=document.getElementById("d_ccy").value;
    var rEl=document.getElementById("d_rate");
    var obj={id:uid(),name:name,currency:ccy,amount:amt,date:document.getElementById("d_date").value||today(),
      rate:ccy!=="EUR"?(num(rEl&&rEl.value)||S.rates[ccy]||1):1};
    updateActive(function(pf){pf.dividends=[obj].concat(pf.dividends);return pf;});
    MODAL=null;render();toast("Dividendo registrato");
  },
  saveRates:function(){
    var out={EUR:1};
    CURRENCIES.filter(function(c){return c!=="EUR";}).forEach(function(c){
      out[c]=num(document.getElementById("r_"+c).value)||DEFAULT_RATES[c];});
    S.rates=out;save();MODAL=null;render();toast("Cambi aggiornati");
  },

  pfRenameAsk:function(d){var n="";S.portfolios.forEach(function(p){if(p.id===d.id)n=p.name;});

  pfDelAsk:function(d){PF_MODE={type:"delete",id:d.id};renderModal();},

  pfConfirm:function(){
    var n=document.getElementById("pf_name").value.trim();
    if(!n){toast("Serve un nome");return;}
    var added=PF_MODE.type==="add";
    if(added){var id=uid();S.portfolios.push({id:id,name:n,positions:[],closed:[],dividends:[]});S.activeId=id;}

    save();PF_MODE=null;
    if(added){MODAL=null;TAB="att";render();toast("Portafoglio \u00ab"+n+"\u00bb creato");}
    else{render();toast("Portafoglio rinominato");}
  },
  pfDel:function(d){
    var rest=S.portfolios.filter(function(p){return p.id!==d.id;});
    S.portfolios=rest.length?rest:[{id:uid(),name:"Principale",positions:[],closed:[],dividends:[]}];
    if(!S.portfolios.some(function(p){return p.id===S.activeId;}))S.activeId=S.portfolios[0].id;
    save();PF_MODE=null;render();toast("Portafoglio eliminato");
  },

  bkCopy:function(){
    var txt=JSON.stringify(S);
    function fallback(){
      var ta=document.createElement("textarea");ta.value=txt;ta.style.position="fixed";ta.style.opacity="0";
      document.body.appendChild(ta);ta.focus();ta.select();
      try{document.execCommand("copy");toast("Backup copiato negli appunti");}catch(e){toast("Copia non riuscita");}
      document.body.removeChild(ta);
    }
    if(navigator.clipboard&&navigator.clipboard.writeText){
      navigator.clipboard.writeText(txt).then(function(){toast("Backup copiato negli appunti");},fallback);
    }else fallback();
  },
  bkPaste:function(){
    function use(txt){
      try{var n=normalizeStore(JSON.parse(txt));if(!n){toast("Testo non riconosciuto");return;}PENDING=n;renderModal();}
      catch(e){toast("Testo non valido");}
    }
    if(navigator.clipboard&&navigator.clipboard.readText){
      navigator.clipboard.readText().then(use,function(){
        var t=prompt("Incolla qui il testo del backup:");if(t)use(t);});
    }else{var t=prompt("Incolla qui il testo del backup:");if(t)use(t);}
  },
  bkExport:function(){
    try{
      var blob=new Blob([JSON.stringify(S,null,2)],{type:"application/json"});
      var url=URL.createObjectURL(blob);
      var a=document.createElement("a");a.href=url;a.download="portafoglio-backup-"+today()+".json";
      document.body.appendChild(a);a.click();document.body.removeChild(a);
      setTimeout(function(){URL.revokeObjectURL(url);},2000);
      toast("File di backup creato");
    }catch(e){toast("Export non riuscito, usa la copia negli appunti");}
  },
  bkImport:function(){document.getElementById("fileIn").click();},
  bkConfirm:function(){S=PENDING;PENDING=null;save();MODAL=null;TAB="att";render();toast("Backup ripristinato");},
  bkCancel:function(){PENDING=null;renderModal();},

/* ============ eventi ============ */
document.addEventListener("click",function(e){
  var el=e.target.closest("[data-act]");
  if(!el)return;
  var act=el.getAttribute("data-act");
  if(act==="closeModal"&&e.target.closest("[data-stop]")&&el.classList.contains("overlay"))return;
  if(["ccyChange","dCcyChange","sellCalc","repDates","calcTerzo"].indexOf(act)>=0)return;
  if(ACT[act]){e.preventDefault();ACT[act]({id:el.getAttribute("data-id"),v:el.getAttribute("data-v")});}
});
document.addEventListener("change",function(e){
  var el=e.target.closest("[data-act]");if(!el)return;
  var act=el.getAttribute("data-act");
  if(act==="ccyChange"||act==="dCcyChange"||act==="repDates")ACT[act]({});
});
document.addEventListener("input",function(e){
  var el=e.target.closest("[data-act]");if(!el)return;
  var act=el.getAttribute("data-act");
  if(act==="sellCalc")sellCalc();
  if(act==="calcTerzo"){
    var quale=el.getAttribute("data-v");
    if(document.getElementById("f_qty")) completaTerzo("f_qty","f_buy","f_tot",quale);
    else completaTerzo("q_qty","q_prezzo","q_tot",quale);
  }
});
document.getElementById("fileIn").addEventListener("change",function(e){
  var file=e.target.files&&e.target.files[0];if(!file)return;
  var reader=new FileReader();
  reader.onload=function(){
    try{var n=normalizeStore(JSON.parse(reader.result));
      if(!n){toast("File non riconosciuto");return;}
      PENDING=n;renderModal();
    }catch(err){toast("File non valido");}
  };
  reader.readAsText(file);e.target.value="";
});

  var eraGrande=null;

    var ora=grande();
    if(ora!==eraGrande){ eraGrande=ora; if(S) render(); }
  }
  window.addEventListener("resize",controlla);
  window.addEventListener("orientationchange",function(){setTimeout(controlla,150);});
  try{
    var mq=window.matchMedia("(min-width:1000px) and (orientation:landscape)");
    if(mq.addEventListener) mq.addEventListener("change",controlla);
    else if(mq.addListener) mq.addListener(controlla);
  }catch(e){}
})();
load();
caricaUI();
render();
if("serviceWorker" in navigator){
  window.addEventListener("load",function(){navigator.serviceWorker.register("sw.js").catch(function(){});});
}
})();
